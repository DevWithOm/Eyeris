services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: retina_screening
      POSTGRES_USER: retina_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retina_user -d retina_screening"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
