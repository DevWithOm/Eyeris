# Model configuration for Diabetic Retinopathy Classification
# Base Architecture: EfficientNet-B0 adapted for 5-class severity grading

model_name: "efficientnet_b0"
model_version: "1.0.0"
architecture: "torchvision.models.efficientnet_b0"
num_classes: 5
input_size: [224, 224]
channels: 3
color_space: "RGB"
dropout: 0.3

normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

preprocessing:
  crop_borders: true
  crop_tolerance: 10
  min_crop_dimension: 50
  resize_method: "bilinear"

weights:
  primary_checkpoint: "artifacts/model_weights/best_model.pth"
  format: "torch_state_dict"
  strict_load: true
